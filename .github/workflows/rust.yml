name: Rust

on:
  push:
    branches: [main, mightyminions]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The mightyminions feature requires that project's Bevy fork.
      - run: cargo clippy -p bevy_tiled_background --all-targets -- -D warnings
      - run: cargo test --lib
