[package]
name = "bevy_tiled_background"
version = "0.6.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "A Bevy plugin for creating tiled, animated UI backgrounds with custom lattices and scrolling"
repository = "https://github.com/mirsella/bevy_tiled_background"
homepage = "https://github.com/mirsella/bevy_tiled_background"
documentation = "https://docs.rs/bevy_tiled_background"
keywords = ["bevy", "ui", "shader", "tiled", "background"]
categories = ["game-development", "graphics", "rendering"]
readme = "README.md"

[features]
# Compatibility with the project's extended clipping API.
# Stock Bevy uses the optimized path without this feature.
mightyminions = []

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "bevy_asset",
  "bevy_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_log",
] }

[dev-dependencies]
wgpu = { version = "29", default-features = false, features = ["gles"] }
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_core_pipeline", "bevy_winit", "x11", "png", "multi_threaded",
] }

[[example]]
name = "simple"
path = "examples/simple.rs"
